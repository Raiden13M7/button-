
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Action Button</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .action-button {
            background-color: #2563eb;
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;

            /* Smooth animation */
            transition: transform 0.2s ease,
                        background-color 0.2s ease,
                        box-shadow 0.2s ease;

            box-shadow: 0 5px 0 #1e40af;
        }

        /* Hover effect */
        .action-button:hover {
            background-color: #1d4ed8;
            transform: scale(1.08);
            box-shadow: 0 7px 12px rgba(37, 99, 235, 0.3);
        }

        /* Active click effect */
        .action-button:active {
            transform: scale(0.94) translateY(3px);
            background-color: #1e40af;
            box-shadow: 0 2px 0 #1e3a8a;
        }
    </style>
</head>

<body>

    <button class="action-button">
        Click Me!
    </button>

</body>
</html>
